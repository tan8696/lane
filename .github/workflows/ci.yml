name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # guard the documented minimum
          - os: ubuntu-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin JSON
        run: |
          python -c "import json;[json.load(open(p)) for p in ['plugins/lane/.claude-plugin/plugin.json','plugins/lane/hooks/hooks.json','.claude-plugin/marketplace.json']]"
      - name: Tests
        run: python -m unittest discover -s tests -t tests -v
